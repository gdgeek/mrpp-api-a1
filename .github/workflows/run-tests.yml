name: Run Tests

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo, pdo_sqlite, pdo_mysql
          ini-values: register_argc_argv=On, output_buffering=4096
          coverage: none

      - name: Install Dependencies
        run: |
          cd api
          composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Security Audit
        run: |
          cd api
          composer audit --abandoned=report

      - name: Prepare Config
        run: |
          cp files/api/config/test.php api/config/test.php
          echo "<?php return ['class' => 'yii\db\Connection', 'dsn' => 'sqlite::memory:', 'charset' => 'utf8'];" > api/config/test_db.php
          cp files/api/config/params.php api/config/params.php

      - name: Run Tests
        run: |
          cd api
          vendor/bin/codecept run unit

      - name: Public property regression tests
        run: |
          cd api
          vendor/bin/phpunit -c tests/public-filter.phpunit.xml

      - name: Independent Identity boundary tests
        env:
          A1_CONTINUITY_REDIS_TEST: "1"
          A1_CONTINUITY_REDIS_HOST: "127.0.0.1"
          A1_CONTINUITY_REDIS_PORT: "6379"
          A1_CONTINUITY_MYSQL_TEST: "1"
          A1_CONTINUITY_MYSQL_HOST: "127.0.0.1"
          A1_CONTINUITY_MYSQL_PORT: "3306"
        run: |
          cd api
          vendor/bin/phpunit -c tests/identity-authority.phpunit.xml
